<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> – Bus Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topbar">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="brand">Hirunz</span>
            <div id="userBox" class="d-none">
                <span id="userName" class="me-3"></span>
                <button class="btn btn-sm btn-outline-light" id="logoutBtn">Log out</button>
            </div>
        </div>
    </header>
    <main class="container py-4">
        <div id="alert"></div>

        <section id="authView" class="mx-auto" style="max-width:420px">
            <h1 class="h3 mb-3">Sign in to book your seat</h1>
            <form id="authForm" class="vstack gap-3">
                <input class="form-control" id="aUser" placeholder="Username" required>
                <input class="form-control d-none" id="aEmail" type="email" placeholder="Email">
                <input class="form-control" id="aPass" type="password" placeholder="Password" required>
                <button class="btn btn-accent" id="authBtn">Log in</button>
                <button type="button" class="btn btn-link p-0" id="toggleAuth">New here? Create an account</button>
            </form>
        </section>

        <section id="searchView" class="d-none">
            <h1 class="h3 mb-3">Where to?</h1>
            <form id="searchForm" class="row g-2 mb-4">
                <div class="col-md-3"><select class="form-select" id="from" required></select></div>
                <div class="col-md-3"><select class="form-select" id="to" required></select></div>
                <div class="col-md-3"><input type="date" class="form-control" id="date" required></div>
                <div class="col-md-3 d-grid"><button class="btn btn-accent">Find buses</button></div>
            </form>
            <div id="busList" class="vstack gap-3"></div>
        </section>

        <section id="seatView" class="d-none">
            <button class="btn btn-link p-0 mb-2" id="backBtn">Back to results</button>
            <h2 class="h4" id="seatTitle"></h2>
            <div class="row g-4">
                <div class="col-lg-5">
                    <div id="seatGrid" class="seat-grid"></div>
                    <p class="small mt-2 text-muted">Grey seats are taken. Amber seats are yours.</p>
                </div>
                <div class="col-lg-7">
                    <form id="bookForm">
                        <div id="passengers" class="vstack gap-3 mb-3">
                            <p class="text-muted">Pick a seat to add a passenger.</p>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <strong id="total">Total: 0</strong>

                            <button class="btn btn-accent" id="bookBtn" disabled>Confirm booking</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
